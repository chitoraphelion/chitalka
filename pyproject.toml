[project]
name = "chitalka"
version = "0.1.0"
description = "PDF and Markdown reader with LaTeX math, source-linked comments and AI-agent workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
chitalka = "chitalka.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
packages = ["chitalka"]

[tool.setuptools.package-data]
chitalka = ["static/*.html", "static/*.js", "static/*.css", "static/vendor/*.js", "static/vendor/*.css", "static/vendor/*.LICENSE", "static/vendor/*.json", "static/vendor/fonts/*", "agent_doc.md"]
